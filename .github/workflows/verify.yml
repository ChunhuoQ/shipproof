name: Verify ShipProof

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Verify Java 8 build
        run: mvn --batch-mode clean verify
      - name: Upload packaged application
        uses: actions/upload-artifact@v4
        with:
          name: shipproof-jar
          path: target/shipproof-1.0.0.jar
          if-no-files-found: error
